spring:
  application:
    name: ticketing

  task:
    scheduling:
      pool:
        # 스프링 기본은 1 — 릴레이가 Kafka 장애로 몇 초 물고 있으면 대기열 입장·만료 스케줄러가 밀린다
        size: 3

  datasource:
    url: jdbc:mysql://localhost:3307/ticketing?serverTimezone=UTC&characterEncoding=UTF-8
    username: ticketing
    password: ticketing

  jpa:
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway만 만든다
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # JVM 기본 시간대(KST)로의 암묵 변환 차단 — DB 값은 항상 UTC 그대로 읽고 쓴다
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # 봉투는 outbox에 JSON 문자열로 저장돼 있다 — 그대로 실어 보낸다
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Kafka가 없을 때(개발·대부분의 테스트) 60초 기본값 대신 1초만 기다리고 포기한다
        max.block.ms: 1000

# 대기열 입장권(JWT) — queue가 발급, reservation은 서명만 검증. 운영에선 환경변수로 덮는다
admission:
  jwt:
    secret: ${ADMISSION_JWT_SECRET:ticket-rush-dev-secret-override-in-prod-0123456789}
    ttl: 10m

queue:
  admission:
    batch-size: 100   # 1초마다 입장시키는 인원 — 4단계에서 값별 DB 에러율 비교
    enabled: true

outbox:
  relay:
    enabled: true     # 서랍(outbox)을 1초마다 비워 Kafka로 발행. Kafka가 없으면 다음 틱에 재시도만 한다
    batch-size: 100
